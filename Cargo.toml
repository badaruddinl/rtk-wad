[package]
name = "xuva"
version = "0.4.1"
edition = "2024"
description = "Adaptive command dispatcher with explainable cross-environment routing"
license = "Apache-2.0"
homepage = "https://github.com/badaruddinl/xuva"
repository = "https://github.com/badaruddinl/xuva"
readme = "README.md"
publish = false

[[bin]]
name = "xuva"
path = "src/main.rs"

[dependencies]
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
