[package]
name = "rtk-wad"
version = "0.2.0"
edition = "2024"
description = "Native Windows launcher for running Linux RTK through WSL with structured arguments"
license = "Apache-2.0"
homepage = "https://github.com/badaruddinl/rtk-wad"
repository = "https://github.com/badaruddinl/rtk-wad"
readme = "README.md"
publish = false

[[bin]]
name = "rtk-wad"
path = "src/main.rs"

[[bin]]
name = "rtk-wsl"
path = "src/bin/rtk-wsl.rs"

[dependencies]
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
