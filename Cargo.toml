[package]
name = "xuva"
version = "0.4.3"
edition = "2024"
rust-version = "1.95"
description = "Adaptive command dispatcher with explainable cross-environment routing"
license = "Apache-2.0"
homepage = "https://github.com/badsleepyday/xuva"
repository = "https://github.com/badsleepyday/xuva"
readme = "README.md"
publish = false

[[bin]]
name = "xuva"
path = "src/main.rs"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"

[dependencies]
rusqlite = { version = "0.40", default-features = false, features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
