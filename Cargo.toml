[package]
name = "xuva"
version = "0.4.0"
edition = "2024"
description = "Adaptive Windows execution dispatcher for raw commands, native RTK, and verified WSL providers"
license = "Apache-2.0"
homepage = "https://github.com/badaruddinl/rtk-wad"
repository = "https://github.com/badaruddinl/rtk-wad"
readme = "README.md"
publish = false

[[bin]]
name = "xuva"
path = "src/main.rs"

[[bin]]
# Compatibility command. Keep this binary through the migration window so
# existing shells, agent hooks, and automation do not break.
name = "rtk-wad"
path = "src/legacy_rtk_wad.rs"

[dependencies]
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
