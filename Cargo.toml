[package]
name = "rtk-wad"
version = "0.4.0-alpha.1"
edition = "2024"
description = "Safe adaptive Windows execution policy for raw commands, native RTK, and verified WSL providers"
license = "Apache-2.0"
homepage = "https://github.com/badaruddinl/rtk-wad"
repository = "https://github.com/badaruddinl/rtk-wad"
readme = "README.md"
publish = false

[[bin]]
name = "rtk-wad"
path = "src/main.rs"

[dependencies]
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
