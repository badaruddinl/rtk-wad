name: Release Provenance

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable version tag to verify, build, test, attest, and publish
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  resolve-release-source:
    runs-on: windows-latest
    outputs:
      gated_sha: ${{ steps.source.outputs.sha }}
      version: ${{ steps.source.outputs.version }}
      is_prerelease: ${{ steps.source.outputs.is_prerelease }}
    steps:
      - name: Check out workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Resolve the exact immutable tag commit
        id: source
        shell: pwsh
        env:
          XUVA_RELEASE_TAG: ${{ inputs.tag }}
        run: |
          $tag = $env:XUVA_RELEASE_TAG
          if ($tag -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?$') {
            throw "Release input is not a valid version tag."
          }
          git fetch --force origin "+refs/tags/${tag}:refs/tags/${tag}"
          if ($LASTEXITCODE -ne 0) { throw "Unable to fetch the exact release tag." }
          $sha = (& git rev-parse "refs/tags/${tag}^{commit}").Trim()
          if ($sha -notmatch '^[0-9a-f]{40}$') { throw "Release tag did not resolve to a commit." }
          git checkout --detach $sha
          if ($LASTEXITCODE -ne 0 -or (& git rev-parse HEAD).Trim() -ne $sha) {
            throw "Unable to check out the resolved release commit."
          }
          $cargoVersion = (& .\scripts\read-cargo-version.ps1).Trim()
          if ($tag.TrimStart('v') -ne $cargoVersion) {
            throw "Release tag and Cargo.toml version differ."
          }
          git fetch origin master
          git merge-base --is-ancestor $sha origin/master
          if ($LASTEXITCODE -ne 0) {
            throw "Release tag commit is not an ancestor of protected origin/master."
          }
          "sha=$sha" >> $env:GITHUB_OUTPUT
          "version=$cargoVersion" >> $env:GITHUB_OUTPUT
          "is_prerelease=$($cargoVersion.Contains('-').ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

  build-release-artifact:
    needs: resolve-release-source
    runs-on: windows-latest
    outputs:
      artifact_digest: ${{ steps.release-artifact.outputs.artifact-digest }}
    env:
      XUVA_RELEASE_TAG: ${{ inputs.tag }}
      XUVA_GATED_SHA: ${{ needs.resolve-release-source.outputs.gated_sha }}
      XUVA_RELEASE_VERSION: ${{ needs.resolve-release-source.outputs.version }}
      XUVA_BUILD_COMMIT_OVERRIDE: ${{ needs.resolve-release-source.outputs.gated_sha }}
    steps:
      - name: Check out the resolved commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve-release-source.outputs.gated_sha }}
          fetch-depth: 0

      - name: Install the exact release Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Revalidate source identity
        shell: pwsh
        run: |
          $head = (& git rev-parse HEAD).Trim()
          if ($head -ne $env:XUVA_GATED_SHA) { throw "Checkout differs from the gated SHA." }
          git fetch --force origin "+refs/tags/$($env:XUVA_RELEASE_TAG):refs/tags/$($env:XUVA_RELEASE_TAG)"
          $tagSha = (& git rev-parse "refs/tags/$($env:XUVA_RELEASE_TAG)^{commit}").Trim()
          if ($tagSha -ne $env:XUVA_GATED_SHA) { throw "Release tag moved after source resolution." }
          $cargoVersion = (& .\scripts\read-cargo-version.ps1).Trim()
          if ($cargoVersion -ne $env:XUVA_RELEASE_VERSION) { throw "Cargo version changed after source resolution." }

      - name: Build, audit, and package once
        shell: pwsh
        run: |
          cargo fmt --all --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --bins
          cargo install cargo-audit --version 0.22.2 --locked
          cargo audit
          cargo install cargo-cyclonedx --version 0.5.9 --locked
          cargo build --release --locked --bins
          .\scripts\package-release.ps1 -Version $env:XUVA_RELEASE_TAG
          cargo cyclonedx --format json
          $sbom = Get-ChildItem -Filter '*.cdx.json' | Select-Object -First 1
          if (-not $sbom) { throw "cargo cyclonedx did not create an SBOM." }
          $sbomName = "xuva-v$($env:XUVA_RELEASE_VERSION).cdx.json"
          Copy-Item $sbom.FullName (Join-Path "dist" $sbomName)
          $cyclonedx = (& "$env:USERPROFILE\.cargo\bin\cargo-cyclonedx.exe" cyclonedx --version).Trim()
          [ordered]@{
            schema_version = 1
            source_commit = $env:XUVA_GATED_SHA
            rustc = (& rustc --version).Trim()
            cargo = (& cargo --version).Trim()
            cargo_audit = (& "$env:USERPROFILE\.cargo\bin\cargo-audit.exe" --version).Trim()
            cargo_cyclonedx = $cyclonedx
          } | ConvertTo-Json | Set-Content `
              -LiteralPath "dist\xuva-v$($env:XUVA_RELEASE_VERSION).toolchain.json" -Encoding utf8
          .\scripts\verify-release-artifact.ps1 -DistributionDirectory dist `
              -ExpectedVersion $env:XUVA_RELEASE_VERSION -ExpectedCommit $env:XUVA_GATED_SHA

      - name: Upload the single release artifact set
        id: release-artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: xuva-release-artifact
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  controlled-release-gate:
    needs: [resolve-release-source, build-release-artifact]
    runs-on: [self-hosted, Windows, WSL]
    environment: release-gate
    outputs:
      gated_sha: ${{ steps.gate-identity.outputs.sha }}
      artifact_digest: ${{ steps.gate-identity.outputs.digest }}
    env:
      XUVA_RELEASE_TAG: ${{ inputs.tag }}
      XUVA_GATED_SHA: ${{ needs.resolve-release-source.outputs.gated_sha }}
      XUVA_RELEASE_VERSION: ${{ needs.resolve-release-source.outputs.version }}
      XUVA_ARTIFACT_DIGEST: ${{ needs.build-release-artifact.outputs.artifact_digest }}
      XUVA_BUILD_COMMIT_OVERRIDE: ${{ needs.resolve-release-source.outputs.gated_sha }}
      XUVA_WSL2_TEST_DISTRO: Ubuntu
    steps:
      - name: Check out the gated commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve-release-source.outputs.gated_sha }}
          fetch-depth: 0

      - name: Download the exact hosted artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: xuva-release-artifact
          path: ${{ runner.temp }}/xuva-gated-dist-wsl2

      - name: Require the exact release Rust toolchain
        shell: powershell
        run: |
          rustup.exe toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
          rustup.exe run 1.97.1 cargo --version

      - name: Provision checksum-pinned RTK verification adapter
        shell: powershell
        run: |
          $url = 'https://github.com/rtk-ai/rtk/releases/download/v0.43.0/rtk-x86_64-pc-windows-msvc.zip'
          $archive = Join-Path $env:RUNNER_TEMP 'rtk-0.43.0.zip'
          Invoke-WebRequest -Uri $url -OutFile $archive
          $expected = '7c5e4a2ef816a4d4ed947ddd74ca3df851fc39ea87d49a3ca2bf3abc515a016b'
          $actual = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "RTK checksum mismatch: $actual" }
          $root = Join-Path $env:RUNNER_TEMP 'rtk-0.43.0'
          Expand-Archive $archive $root -Force
          $rtk = Get-ChildItem $root -Filter rtk.exe -Recurse | Select-Object -First 1
          if (-not $rtk) { throw 'RTK archive did not contain rtk.exe' }
          "XUVA_RELEASE_RTK=$($rtk.FullName)" >> $env:GITHUB_ENV

      - name: Test the gated source and the exact hosted artifact
        shell: powershell
        run: |
          if ((git rev-parse HEAD).Trim() -ne $env:XUVA_GATED_SHA) {
            throw "Self-hosted checkout differs from the gated SHA."
          }
          if ($env:XUVA_ARTIFACT_DIGEST -notmatch '^[0-9a-f]{64}$') {
            throw "Hosted artifact has no valid immutable digest."
          }
          $distribution = Join-Path $env:RUNNER_TEMP "xuva-gated-dist-wsl2"
          .\scripts\verify-release-artifact.ps1 -DistributionDirectory $distribution `
              -ExpectedVersion $env:XUVA_RELEASE_VERSION -ExpectedCommit $env:XUVA_GATED_SHA
          $archive = Join-Path $distribution "xuva-v$($env:XUVA_RELEASE_VERSION)-windows-x86_64.zip"
          $expanded = Join-Path $env:RUNNER_TEMP "xuva-gated-package-$($env:GITHUB_RUN_ID)"
          if (Test-Path -LiteralPath $expanded) {
            Remove-Item -LiteralPath $expanded -Recurse -Force
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $expanded
          .\scripts\verify-package.ps1 -PackageDirectory $expanded `
              -ExpectedVersion $env:XUVA_RELEASE_VERSION -ExpectedCommit $env:XUVA_GATED_SHA
          .\scripts\verify-release.ps1 -Cargo "$env:USERPROFILE\.cargo\bin\cargo.exe" `
              -NativeRtk $env:XUVA_RELEASE_RTK -TestBinary (Join-Path $expanded "xuva.exe")

      - name: Export successful gate identity
        id: gate-identity
        shell: powershell
        run: |
          "sha=$($env:XUVA_GATED_SHA)" >> $env:GITHUB_OUTPUT
          "digest=$($env:XUVA_ARTIFACT_DIGEST)" >> $env:GITHUB_OUTPUT

  controlled-release-gate-wsl1:
    needs: [resolve-release-source, build-release-artifact]
    runs-on: [self-hosted, Windows, WSL]
    environment: release-gate
    outputs:
      gated_sha: ${{ steps.gate-identity.outputs.sha }}
      artifact_digest: ${{ steps.gate-identity.outputs.digest }}
    env:
      XUVA_GATED_SHA: ${{ needs.resolve-release-source.outputs.gated_sha }}
      XUVA_RELEASE_VERSION: ${{ needs.resolve-release-source.outputs.version }}
      XUVA_ARTIFACT_DIGEST: ${{ needs.build-release-artifact.outputs.artifact_digest }}
      XUVA_WSL1_TEST_DISTRO: Ubuntu-RTK-WSL1
    steps:
      - name: Check out the gated commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve-release-source.outputs.gated_sha }}
          fetch-depth: 0

      - name: Download the exact hosted artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: xuva-release-artifact
          path: ${{ runner.temp }}/xuva-gated-dist-wsl1

      - name: Require exact Windows Rust and prove WSL1 version
        shell: powershell
        run: |
          rustup.exe toolchain install 1.97.1 --profile minimal
          if ($LASTEXITCODE -ne 0) { throw 'Unable to install Rust 1.97.1.' }
          $inventory = ((wsl.exe --list --verbose | Out-String) -replace [char]0, '')
          if ($inventory -notmatch '(?m)^\s*\*?\s*Ubuntu-RTK-WSL1\s+\S+\s+1\s*$') {
            throw "Ubuntu-RTK-WSL1 is not proven to be WSL 1.`n$inventory"
          }

      - name: Run WSL1 contract against the packaged executable
        shell: powershell
        run: |
          $distribution = Join-Path $env:RUNNER_TEMP "xuva-gated-dist-wsl1"
          .\scripts\verify-release-artifact.ps1 -DistributionDirectory $distribution `
              -ExpectedVersion $env:XUVA_RELEASE_VERSION -ExpectedCommit $env:XUVA_GATED_SHA
          $archive = Join-Path $distribution "xuva-v$($env:XUVA_RELEASE_VERSION)-windows-x86_64.zip"
          $expanded = Join-Path $env:RUNNER_TEMP "xuva-gated-wsl1-$($env:GITHUB_RUN_ID)"
          if (Test-Path -LiteralPath $expanded) {
            Remove-Item -LiteralPath $expanded -Recurse -Force
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $expanded
          .\scripts\verify-package.ps1 -PackageDirectory $expanded `
              -ExpectedVersion $env:XUVA_RELEASE_VERSION -ExpectedCommit $env:XUVA_GATED_SHA
          $env:XUVA_TEST_BINARY = Join-Path $expanded "xuva.exe"
          $env:XUVA_WSL_BACKEND = 'wsl1'
          $env:XUVA_WSL_DISTRO = $env:XUVA_WSL1_TEST_DISTRO
          $doctor = ((& $env:XUVA_TEST_BINARY doctor wc --refresh | Out-String) -replace [char]0, '')
          if ($LASTEXITCODE -ne 0 -or
              $doctor -notmatch '(?m)^inspected_distro=Ubuntu-RTK-WSL1;user=[^;]+;wsl_version=1;dedicated=true;installation_id=[0-9a-fA-F]{8}(?:-[0-9a-fA-F]{4}){3}-[0-9a-fA-F]{12};') {
            throw "The exact packaged XUVA binary did not validate the dedicated WSL1 runtime.`n$doctor"
          }
          rustup.exe run 1.97.1 cargo test --locked --test process_contract -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { throw 'Packaged executable failed the WSL1 process contract.' }

      - name: Export successful WSL1 gate identity
        id: gate-identity
        shell: powershell
        run: |
          "sha=$($env:XUVA_GATED_SHA)" >> $env:GITHUB_OUTPUT
          "digest=$($env:XUVA_ARTIFACT_DIGEST)" >> $env:GITHUB_OUTPUT

  attest-and-publish:
    needs: [resolve-release-source, build-release-artifact, controlled-release-gate, controlled-release-gate-wsl1]
    runs-on: windows-latest
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      XUVA_RELEASE_TAG: ${{ inputs.tag }}
      XUVA_GATED_SHA: ${{ needs.controlled-release-gate.outputs.gated_sha }}
      XUVA_RELEASE_VERSION: ${{ needs.resolve-release-source.outputs.version }}
      XUVA_ARTIFACT_DIGEST: ${{ needs.controlled-release-gate.outputs.artifact_digest }}
      XUVA_BUILD_ARTIFACT_DIGEST: ${{ needs.build-release-artifact.outputs.artifact_digest }}
    steps:
      - name: Check out the gated commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.controlled-release-gate.outputs.gated_sha }}
          fetch-depth: 0

      - name: Download the tested artifact set
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: xuva-release-artifact
          path: dist

      - name: Revalidate the publish boundary
        shell: pwsh
        env:
          XUVA_WSL1_GATE_SHA: ${{ needs.controlled-release-gate-wsl1.outputs.gated_sha }}
          XUVA_WSL1_GATE_DIGEST: ${{ needs.controlled-release-gate-wsl1.outputs.artifact_digest }}
        run: |
          if ((git rev-parse HEAD).Trim() -ne $env:XUVA_GATED_SHA) {
            throw "Publish checkout differs from the controlled gate SHA."
          }
          git fetch --force origin "+refs/tags/$($env:XUVA_RELEASE_TAG):refs/tags/$($env:XUVA_RELEASE_TAG)"
          $tagSha = (& git rev-parse "refs/tags/$($env:XUVA_RELEASE_TAG)^{commit}").Trim()
          if ($tagSha -ne $env:XUVA_GATED_SHA) { throw "Release tag moved after the controlled gate." }
          if ($env:XUVA_ARTIFACT_DIGEST -ne $env:XUVA_BUILD_ARTIFACT_DIGEST) {
            throw "Controlled gate artifact digest differs from the hosted build digest."
          }
          if ($env:XUVA_WSL1_GATE_SHA -ne $env:XUVA_GATED_SHA -or
              $env:XUVA_WSL1_GATE_DIGEST -ne $env:XUVA_ARTIFACT_DIGEST) {
            throw "WSL1 gate did not approve the exact publish commit and artifact."
          }
          .\scripts\verify-release-artifact.ps1 -DistributionDirectory dist `
              -ExpectedVersion $env:XUVA_RELEASE_VERSION -ExpectedCommit $env:XUVA_GATED_SHA

      - name: Attest tested release artifacts
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            dist/*.zip
            dist/*.sha256
            dist/*.cdx.json
            dist/*.toolchain.json

      - name: Refuse an existing mutable release boundary
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $uri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/tags/$env:XUVA_RELEASE_TAG"
          $headers = @{
            Accept = "application/vnd.github+json"
            Authorization = "Bearer $env:GH_TOKEN"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $exists = $false
          try {
            $null = Invoke-RestMethod -Method Get -Uri $uri -Headers $headers -ErrorAction Stop
            $exists = $true
          } catch {
            $statusCode = [int]$_.Exception.Response.StatusCode
            if ($statusCode -ne 404) {
              throw "Unable to prove that the release boundary is unused (HTTP $statusCode): $($_.Exception.Message)"
            }
          }
          if ($exists) {
            throw "Release $env:XUVA_RELEASE_TAG already exists; XUVA never replaces release assets."
          }

      - name: Create the tested release as a draft
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ inputs.tag }}
          draft: true
          prerelease: ${{ needs.resolve-release-source.outputs.is_prerelease }}
          make_latest: false
          overwrite_files: false
          fail_on_unmatched_files: true
          files: |
            dist/*.zip
            dist/*.sha256
            dist/*.cdx.json
            dist/*.toolchain.json

      - name: Publish the immutable draft with explicit latest semantics
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          XUVA_IS_PRERELEASE: ${{ needs.resolve-release-source.outputs.is_prerelease }}
        run: |
          $arguments = @("release", "edit", $env:XUVA_RELEASE_TAG, "--draft=false")
          if ($env:XUVA_IS_PRERELEASE -eq "true") {
            $arguments += @("--prerelease", "--latest=false")
          } else {
            $arguments += @("--prerelease=false", "--latest")
          }
          & gh @arguments
          if ($LASTEXITCODE -ne 0) { throw "Unable to publish the verified draft release." }
