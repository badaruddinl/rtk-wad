name: Windows CI

on:
  push:
    branches: [master, development]
  pull_request:
    branches: [master, development]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-quality:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt, clippy

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked --bins -- --test-threads=1

      - name: Audit locked dependencies
        shell: pwsh
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo audit

      - name: Detect Ubuntu WSL distro
        id: wsl
        shell: pwsh
        run: |
          $available = @(wsl.exe --list --quiet 2>$null) -match 'Ubuntu'
          "available=$($available.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Test WSL process contract
        if: steps.wsl.outputs.available == 'true'
        run: cargo test --locked --test process_contract -- --test-threads=1

      - name: Report WSL runner capability gap
        if: steps.wsl.outputs.available != 'true'
        shell: pwsh
        run: Write-Warning 'Ubuntu WSL distro is unavailable on this hosted runner; local WSL process-contract evidence remains required.'

      - name: Release build
        run: cargo build --locked --release --bins

      - name: Package
        run: cargo package --locked --allow-dirty

      - name: Audit package archive
        shell: pwsh
        run: |
          $archive = Get-ChildItem -LiteralPath target\package -Filter '*.crate' | Select-Object -First 1
          if ($null -eq $archive) { throw 'cargo package did not produce an archive' }
          $forbidden = tar -tf $archive.FullName | Select-String -Pattern '(^|/)target/|\.log$|(^|/)(\.env|config\.toml)$|[A-Za-z]:/'
          if ($null -ne $forbidden) { $forbidden | ForEach-Object { Write-Error $_ }; exit 1 }

  packaging-recovery:
    needs: rust-quality
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Python for XUVA tokenizer contracts
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Build release launcher
        run: cargo build --locked --release --bins

      - name: Run tokenizer dependency contracts
        shell: pwsh
        run: |
          .\tests\tokenizer-bootstrap-contract.ps1
          .\tests\tokenizer-install-contract.ps1

      - name: Run public corpus provision contract
        shell: pwsh
        run: .\tests\public-corpus-provision-contract.ps1

      - name: Run isolated install and recovery contract
        shell: pwsh
        run: .\tests\packaging-contract.ps1
