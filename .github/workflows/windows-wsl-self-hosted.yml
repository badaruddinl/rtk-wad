name: Windows WSL Process Contract

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  process-contract:
    # This job is intentionally separate from hosted Windows CI. Register a
    # controlled Windows runner with all three labels and an Ubuntu WSL distro.
    runs-on: [self-hosted, Windows, WSL]
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      # The Rust action invokes bash.exe internally on Windows. That resolves
      # through the machine's default WSL distro, which may be Docker Desktop
      # rather than the controlled Ubuntu provider used by this contract.
      - name: Require stable Windows Rust
        shell: powershell
        run: |
          $rustup = Get-Command rustup.exe -ErrorAction Stop
          & $rustup.Source toolchain install stable --profile minimal
          if ($LASTEXITCODE -ne 0) { throw 'Unable to install the stable Rust toolchain.' }
          & $rustup.Source run stable cargo --version
          if ($LASTEXITCODE -ne 0) { throw 'Unable to run the stable Cargo toolchain.' }

      - name: Require the controlled Ubuntu WSL provider
        shell: powershell
        run: |
          # Windows PowerShell can decode this UTF-16 WSL output with NUL
          # characters, so normalize before comparing a distro name.
          $available = @(
            wsl.exe --list --quiet 2>$null |
              ForEach-Object { $_ -replace [char]0, '' } |
              Where-Object { $_ -eq 'Ubuntu' }
          )
          if ($available.Count -eq 0) { throw 'The self-hosted WSL runner must provide an Ubuntu distro.' }
          wsl.exe --distribution Ubuntu --exec /usr/bin/env true

      - name: Run Windows/WSL process contract
        shell: powershell
        run: rustup.exe run stable cargo test --test process_contract -- --test-threads=1
